name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only. No publish, no secret, no token: this workflow just replays the
# repo's standing invariants (core.md) on a clean machine.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - run: pnpm -r build

      - run: pnpm -r test
